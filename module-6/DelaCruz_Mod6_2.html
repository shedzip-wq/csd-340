<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Page title -->
    <title>CSD 340 Web Development with HTML and CSS</title>

    <!-- Link to external CSS file -->
    <link rel="stylesheet" href="DelaCruz_Mod6_2.css">
</head>

<body>

  <!-- Header Section -->
  <header>
    <h1>Assignment 6.2: Build a Web Page - Part 5</h1>
  </header>

  <!-- Navigation Bar -->
  <div id="navbar">
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </div>

  <!-- Main Content Container -->
  <div id="container">

    <!-- Card Component -->
    <div class="card">

      <!-- Card Title -->
      <div class="card-title">Top 5 Favorite Foods</div>

      <!-- Card Content -->
      <div class="card-content">
        <ol>
          <!-- Each list item contains a recipe link that opens in a new tab -->
          <li><a href="https://www.allrecipes.com/recipe/262694/filipino-pancit/" target="_blank">Pancit</a></li>
          <li><a href="https://www.allrecipes.com/recipe/35151/filipino-lumpia/" target="_blank">Lumpia</a></li>
          <li><a href="https://www.allrecipes.com/recipe/229960/simple-sushi/" target="_blank">Sushi</a></li>
          <li><a href="https://www.allrecipes.com/recipe/23431/fettuccine-alfredo/" target="_blank">Fettuccine Alfredo</a></li>
          <li><a href="https://www.allrecipes.com/recipe/19344/ramen-noodle-soup/" target="_blank">Ramen</a></li>
        </ol>
      </div>

    </div>
  </div>

  <!-- Footer Section -->
  <footer>
    <p>
      <!-- Link back to landing page -->
      <a href="index.html">Back to Landing Page</a>
    </p>
  </footer>

</body>
</html>
