<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Page title -->
    <title>CSD 340 Web Development with HTML and CSS</title>

    <!-- Link to external CSS file -->
    <link rel="stylesheet" href="DelaCruz_Mod4_2.css">
</head>

<body>

    <!-- Main container for page content -->
    <div id="container">

         <!-- Assignment title -->
        <h1>Assignment 4.2: Build a Web Page Exercise - Part 4</h1>

        <!-- Image gallery section -->
        <div id="image-gallery">

            <!-- Book 1 -->
            <div class="gallery-item">
                <h3>Eat Pray Love</h3>
                <figure>
                    <img src="images/eatpraylove.jpg" alt="Eat Pray Love Book Cover">
                    <figcaption>(author: Elizabeth Gilbert)</figcaption>
                </figure>
            </div>

            <!-- Book 2 -->
            <div class="gallery-item">
                <h3>The Return of the King</h3>
                <figure>
                    <img src="images/returnoftheking.jpg" alt="The Return of the King Book Cover">
                    <figcaption>(author: J.R.R. Tolkien)</figcaption>
                </figure>
            </div>

            <!-- Book 3 -->
            <div class="gallery-item">
                <h3>A Walk to Remember</h3>
                <figure>
                    <img src="images/AWalkToRemember.jpg" alt="A Walk to Remember Book Cover">
                    <figcaption>(author: Nicholas Sparks)</figcaption>
                </figure>
            </div>

        </div>

        <div class="back-link-wrapper">
            <a href="../index.html">Back to Landing Page</a>
        </div>
