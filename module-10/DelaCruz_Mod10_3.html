<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSD 340 Web Development with HTML and CSS</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 40px;
        }

        /* Styles for the smaller clickable thumbnails */
        img {
            width: 150px;
            height:auto
            margin: 15px;
            cursor: pointer;
            border: 3px solid #ccc;
            border-radius: 10px;
        }

         /* Styles for the main pet display image */
        #mainImage {
            width: 350px;
            height: auto;
            border: 4px solid #444;
            border-radius: 10px;
            margin-bottom: 30px;
        }
    </style>

    <script>
      // Function that updates the main pet image when a thumbnail is clicked
        function displayImage(imageFile) {
            // Get the main image element by its ID
            document.getElementById("mainImage").src = imageFile;
        }
    </script>
</head>

<body>

    <h1>Assignment 10.3: JavaScript - Part 2</h1>

    <p>Click a pet to change the main display!</p>

    <!-- Main display image that updates when thumbnails are clicked -->
    <img id="mainImage" src="pet1.jpeg" alt="Main Pet">

    <br><br>

    <!-- My 4 pet images -->
    <img src="pet1.jpeg" onclick="displayImage('pet1.jpeg')" alt="Pet 1">
    <img src="pet2.jpeg" onclick="displayImage('pet2.jpeg')" alt="Pet 2">
    <img src="pet3.jpeg" onclick="displayImage('pet3.jpeg')" alt="Pet 3">
    <img src="pet4.jpeg" onclick="displayImage('pet4.jpeg')" alt="Pet 4">

</body>
</html>
